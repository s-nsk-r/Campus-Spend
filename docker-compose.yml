version: "3.8"

services:
  # Backend Container Instance 1
  backend1:
    build: .
    container_name: campus-spend-backend-1
    restart: always
    environment:
      - INSTANCE_ID=backend-1
      - DATABASE_URL=${DATABASE_URL:-sqlite:///./campus_spend.db}
    expose:
      - "8000"
    networks:
      - campus_spend_net

  # Backend Container Instance 2
  backend2:
    build: .
    container_name: campus-spend-backend-2
    restart: always
    environment:
      - INSTANCE_ID=backend-2
      - DATABASE_URL=${DATABASE_URL:-sqlite:///./campus_spend.db}
    expose:
      - "8000"
    networks:
      - campus_spend_net

  # Backend Container Instance 3
  backend3:
    build: .
    container_name: campus-spend-backend-3
    restart: always
    environment:
      - INSTANCE_ID=backend-3
      - DATABASE_URL=${DATABASE_URL:-sqlite:///./campus_spend.db}
    expose:
      - "8000"
    networks:
      - campus_spend_net

  # Nginx Load Balancer Reverse Proxy (Port 8080 on Host -> Port 80 in container)
  nginx:
    image: nginx:alpine
    container_name: campus-spend-nginx-lb
    restart: always
    ports:
      - "8080:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend1
      - backend2
      - backend3
    networks:
      - campus_spend_net

networks:
  campus_spend_net:
    driver: bridge
