events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile        on;
    keepalive_timeout  65;

    # Upstream cluster: 3 backend container instances with max_fails and fail_timeout
    upstream backend_cluster {
        server backend1:8000 max_fails=3 fail_timeout=10s;
        server backend2:8000 max_fails=3 fail_timeout=10s;
        server backend3:8000 max_fails=3 fail_timeout=10s;
    }

    server {
        listen 80;
        server_name localhost;

        location / {
            proxy_pass http://backend_cluster;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Custom response header revealing which backend served the request
            add_header X-Served-By $upstream_addr always;

            # =========================================================================
            # Q1(c) Zero-Downtime Failover & Health Check Configuration:
            # If an upstream instance dies, automatically reroute request to healthy nodes
            # =========================================================================
            proxy_next_upstream error timeout invalid_header http_500 http_502 http_503 http_504;
            proxy_next_upstream_tries 3;
            proxy_next_upstream_timeout 10s;
            proxy_connect_timeout 2s;
            proxy_read_timeout 10s;
        }

        # Dedicated Load Balancer status probe
        location /lb-status {
            return 200 '{"status": "UP", "cluster": "3-Instances-Fault-Tolerant-Nginx"}\n';
            add_header Content-Type application/json;
        }
    }
}
