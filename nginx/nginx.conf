events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile        on;
    keepalive_timeout  65;

    # Upstream cluster: 3 backend container instances (Q1a)
    upstream backend_cluster {
        server backend1:8000;
        server backend2:8000;
        server backend3:8000;
    }

    server {
        listen 80;
        server_name localhost;

        location / {
            proxy_pass http://backend_cluster;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Custom response header revealing which backend served the request
            add_header X-Served-By $upstream_addr always;
        }

        # Dedicated Load Balancer status probe
        location /lb-status {
            return 200 '{"status": "UP", "cluster": "3-Instances-Nginx-LB"}\n';
            add_header Content-Type application/json;
        }
    }
}
